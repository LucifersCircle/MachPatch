name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Build and test
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test

      - name: Verify CLI
        run: .build/debug/machpatch --help
